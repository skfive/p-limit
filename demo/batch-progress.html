<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>배치 진행 데모 — p-limit</title>

	<!--
		p-limit 코어(../index.js)는 transitive 로 `yocto-queue` bare specifier 를
		import 한다. 빌드 도구 없이 <script type="module"> 만으로 동작하도록 import map
		으로 이를 해소한다. 저장소 루트에서 `npm install` 을 한 번 실행해야 아래
		경로가 존재한다(readme.md 참고).
	-->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../node_modules/yocto-queue/index.js"
		}
	}
	</script>

	<link rel="stylesheet" href="batch-progress.css">
</head>
<body>
	<main id="batch-progress-root" class="batch-progress" data-state="idle">
		<header class="batch-progress__header">
			<h1>배치 진행 데모</h1>
			<p>
				<code>p-limit</code> 으로 동시성 <strong>2</strong> 제한하에 샘플 작업을 실행하고
				대기·실행·완료·취소·실패 상태 전이와 전체 진행률을 확인합니다.
			</p>
			<div class="batch-progress__controls">
				<button id="batch-progress-start" type="button" aria-label="배치 시작">시작</button>
				<button id="batch-progress-reset" type="button" aria-label="배치 초기화">초기화</button>
			</div>
		</header>

		<div class="batch-progress__progress">
			<div
				id="batch-progress-bar"
				class="batch-progress__bar"
				role="progressbar"
				aria-label="배치 진행률"
				aria-valuemin="0"
				aria-valuemax="100"
				aria-valuenow="0"
			>
				<span class="batch-progress__bar-fill"></span>
			</div>
			<span id="batch-progress-percent" class="batch-progress__percent">0%</span>
		</div>

		<p id="batch-progress-status" class="batch-progress__status" role="status" aria-live="polite">
			대기 — 시작 버튼을 눌러 배치를 실행하세요.
		</p>

		<ul id="batch-task-list" class="batch-progress__task-list"></ul>
	</main>

	<script type="module" src="batch-progress.js"></script>
</body>
</html>
