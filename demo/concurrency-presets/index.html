<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>동시성 프리셋 비교 — p-limit 데모</title>

	<!--
		p-limit 코어(../../index.js)는 transitive로 `yocto-queue` bare specifier를
		import 한다. 브라우저 네이티브 ESM에서 이를 해소하기 위해 import map을 쓴다
		(빌드 도구 없이 <script type="module">로만 동작 — plan §2). 저장소 루트에서
		`npm install`을 한 번 실행해야 아래 경로가 존재한다(readme.md 참고).
	-->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../../node_modules/yocto-queue/index.js"
		}
	}
	</script>

	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="summary.css">
</head>
<body>
	<main id="concurrency-presets-root" class="concurrency-presets" data-state="idle">
		<header class="concurrency-presets__header">
			<h1>동시성 프리셋 비교</h1>
			<p>동일한 작업 집합을 동시성 <strong>1 · 2 · 4</strong>로 각각 실행해 타임라인 차이를 비교합니다.</p>
			<div class="concurrency-presets__controls">
				<button id="preset-run" type="button" aria-label="프리셋 실행">실행</button>
				<button id="preset-reset" type="button">초기화</button>
			</div>
		</header>

		<div class="concurrency-presets__panel">
			<section class="concurrency-presets__preset" aria-labelledby="preset-1-title">
				<h2 id="preset-1-title">동시성 1</h2>
				<ul id="timeline-preset-1" class="concurrency-presets__timeline"></ul>
			</section>

			<section class="concurrency-presets__preset" aria-labelledby="preset-2-title">
				<h2 id="preset-2-title">동시성 2</h2>
				<ul id="timeline-preset-2" class="concurrency-presets__timeline"></ul>
			</section>

			<section class="concurrency-presets__preset" aria-labelledby="preset-4-title">
				<h2 id="preset-4-title">동시성 4</h2>
				<ul id="timeline-preset-4" class="concurrency-presets__timeline"></ul>
			</section>
		</div>

		<p class="concurrency-presets__status" role="status" aria-live="polite"></p>

		<!--
			성능 요약 UI (F68F701A7A-113) — 기존 실행/초기화/타임라인 계약 위에 additive 로
			얹는 요약 region. selector/ID/token 은 frozen ui-contract 를 그대로 따른다.
		-->
		<section id="perf-summary" class="perf-summary" aria-live="polite">
			<p id="perf-summary-status" class="perf-summary__status"></p>
			<div id="perf-summary-cards" class="perf-summary__cards">
				<article id="perf-card-c1" class="perf-card">
					<span class="perf-card__label">동시성 1</span>
					<span class="perf-card__time">—</span>
					<span class="perf-card__speedup">—</span>
				</article>
				<article id="perf-card-c2" class="perf-card">
					<span class="perf-card__label">동시성 2</span>
					<span class="perf-card__time">—</span>
					<span class="perf-card__speedup">—</span>
				</article>
				<article id="perf-card-c4" class="perf-card">
					<span class="perf-card__label">동시성 4</span>
					<span class="perf-card__time">—</span>
					<span class="perf-card__speedup">—</span>
				</article>
			</div>
		</section>
	</main>

	<script type="module" src="main.js"></script>
	<script type="module" src="summary.js"></script>
</body>
</html>
