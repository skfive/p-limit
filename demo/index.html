<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>p-limit 상태 Inspector</title>
	<link rel="stylesheet" href="inspector.css">
	<!-- 라이브러리 코어(index.js)가 소비하는 bare specifier를 브라우저에서 해석하기 위한 import map. -->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../node_modules/yocto-queue/index.js"
		}
	}
	</script>
</head>
<body>
	<main>
		<!-- #inspector-root: Inspector 루트 컨테이너 (계약 §4.2) -->
		<section id="inspector-root" class="inspector" aria-labelledby="inspector-title">
			<h1 id="inspector-title">p-limit 상태 Inspector</h1>
			<p class="inspector__intro">
				작업을 추가하면 limiter의 상태 전이를 <strong>polling 없이</strong> 구독(subscribe)으로 실시간 관찰합니다.
				상태 배지와 active/pending/concurrency 값이 전이마다 갱신됩니다.
			</p>

			<!-- 상태 배지 (§4.2 #inspector-status-badge, §4.6 aria-live="polite") -->
			<div id="inspector-status-badge" class="inspector__badge" role="status" aria-live="polite" data-status="idle">Idle</div>

			<!-- 지표 표시 (§4.3 .inspector__metric) -->
			<div class="inspector__metrics">
				<p class="inspector__metric">
					<span class="inspector__metric-label">실행 중 (active)</span>
					<span id="inspector-active-count" class="inspector__metric-value" aria-label="실행 중 태스크 수">0</span>
				</p>
				<p class="inspector__metric">
					<span class="inspector__metric-label">대기 중 (pending)</span>
					<span id="inspector-pending-count" class="inspector__metric-value" aria-label="대기 중 태스크 수">0</span>
				</p>
				<p class="inspector__metric">
					<span class="inspector__metric-label">동시성 (concurrency)</span>
					<span id="inspector-concurrency-value" class="inspector__metric-value" aria-label="현재 동시성 한도">0</span>
				</p>
			</div>

			<!-- 실행 control 그룹 (§4.3 .inspector__controls, §4.6 명시적 aria-label + Tab 접근) -->
			<div class="inspector__controls" role="group" aria-label="Inspector 실행 제어">
				<button type="button" id="inspector-enqueue" class="inspector__control" aria-label="작업 추가 (enqueue)">작업 추가</button>
				<button type="button" id="inspector-clear" class="inspector__control" aria-label="대기 큐 비우기 (clearQueue)">큐 비우기</button>
				<button type="button" id="inspector-pause" class="inspector__control" aria-label="일시정지 (pause)">일시정지</button>
				<button type="button" id="inspector-resume" class="inspector__control" aria-label="재개 (resume)">재개</button>
			</div>
		</section>
	</main>

	<script type="module" src="inspector.js"></script>
</body>
</html>
