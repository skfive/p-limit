<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>p-limit 동시성 프리셋 비교</title>
	<link rel="stylesheet" href="preset-lab.css">
	<!-- 라이브러리 코어(index.js)가 소비하는 bare specifier를 브라우저에서 해석하기 위한 import map. -->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../node_modules/yocto-queue/index.js"
		}
	}
	</script>
</head>
<body>
	<main>
		<!-- #preset-lab: 컴포넌트 루트 컨테이너 (§5.1) -->
		<section id="preset-lab" class="preset-lab" aria-labelledby="preset-lab-title">
			<h1 id="preset-lab-title">p-limit 동시성 프리셋 비교</h1>
			<p class="preset-lab__intro">
				프리셋을 선택하고 실행하면 동일한 작업 배치를 선택한 동시 실행 한도로 처리합니다.
				실행 중 <strong>실행 중(active)</strong>·<strong>대기 중(pending)</strong> 카운터로 한도 차이를 관찰하세요.
			</p>

			<!-- 프리셋 선택 그룹 (§5.2 .preset-lab__controls) -->
			<div class="preset-lab__controls" role="group" aria-label="동시성 프리셋 선택">
				<button type="button" id="preset-slow" class="preset-lab__preset" aria-pressed="false" data-concurrency="1">느림 (동시 1)</button>
				<button type="button" id="preset-balanced" class="preset-lab__preset" aria-pressed="false" data-concurrency="2">균형 (동시 2)</button>
				<button type="button" id="preset-fast" class="preset-lab__preset" aria-pressed="false" data-concurrency="4">빠름 (동시 4)</button>
			</div>

			<!-- 실행 control (§5.1 #preset-run, §5.5 명시적 aria-label) -->
			<button type="button" id="preset-run" class="preset-lab__run" aria-label="선택한 프리셋으로 동시성 데모 실행">실행</button>

			<!-- active/pending 카운터 (§5.2 .preset-lab__metrics, §5.5 aria-live) -->
			<div class="preset-lab__metrics">
				<p class="preset-lab__metric">
					<span class="preset-lab__metric-label">실행 중 (active)</span>
					<span id="active-count" class="preset-lab__metric-value" role="status" aria-live="polite" aria-label="실행 중 태스크 수">0</span>
				</p>
				<p class="preset-lab__metric">
					<span class="preset-lab__metric-label">대기 중 (pending)</span>
					<span id="pending-count" class="preset-lab__metric-value" role="status" aria-live="polite" aria-label="대기 중 태스크 수">0</span>
				</p>
			</div>

			<!-- 상태 메시지 (§5.3 상태명 화면 텍스트, §5.5 aria-live) -->
			<p id="status-message" class="preset-lab__status" role="status" aria-live="polite" data-state="idle">상태: 대기 중 — 프리셋을 선택하고 실행하세요</p>

			<!-- 결과 표 (§5.2 .preset-lab__result): 각 태스크 완료 시 행 추가(§4) + 프리셋별 최대 동시 실행 수·완료 시간 비교 -->
			<table id="result-table" class="preset-lab__result">
				<caption>태스크 완료별 실행 결과 (마지막 행 = 프리셋 최종 비교)</caption>
				<thead>
					<tr>
						<th scope="col">프리셋</th>
						<th scope="col">완료 태스크</th>
						<th scope="col">최대 동시 실행</th>
						<th scope="col">경과(ms)</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</section>
	</main>

	<script type="module" src="preset-lab.js"></script>
</body>
</html>
