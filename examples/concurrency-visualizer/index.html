<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>p-limit 동시성 시각화 예제</title>
	<!--
		시각 스타일은 ui-contract@v1 (docs/design/concurrency-visualizer-contract.md)
		§6 을 구현한 style.css 에 정의된다. 모든 색상은 :root 토큰(var(--…))으로만
		참조하며(하드코딩 hex 없음), 외부 자원 0건으로 file:// 직접 열기에서도 동작한다.
	-->
	<link rel="stylesheet" href="style.css">
	<!--
		p-limit 코어(../../index.js)는 transitive 의존으로 bare specifier
		'yocto-queue'(기존 dependency, 신규 추가 아님)를 import 한다.
		브라우저 네이티브 ESM 은 bare specifier 를 해석하지 못하므로 아래
		import map 으로 로컬 파일 경로에 매핑한다(외부 CDN 0건 — 저장소 루트에서
		`npm install` 후 정적 서버로 열면 동작). module 스크립트보다 먼저 위치한다.
	-->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../../node_modules/yocto-queue/index.js"
		}
	}
	</script>
</head>
<body>
	<main class="app">
		<h1>p-limit 동시성 시각화</h1>
		<p class="intro">
			작업 수와 동시성(concurrency)을 선택하고 실행하면, 각 작업이
			<em>대기 → 실행 → 완료/에러</em>로 전이되는 과정과
			집계 카운터가 실시간으로 갱신됩니다.
		</p>

		<section class="controls" aria-label="컨트롤">
			<div class="control">
				<label class="control__label" for="task-count-input">작업 수</label>
				<input type="number" id="task-count-input" min="1" max="30" value="12">
			</div>
			<div class="control">
				<label class="control__label" for="concurrency-slider">동시성</label>
				<div class="control__slider-row">
					<input type="range" id="concurrency-slider" min="1" max="10" step="1" value="3">
					<output id="concurrency-value" for="concurrency-slider">3</output>
				</div>
			</div>
			<button type="button" id="start-btn" class="btn btn--primary">실행</button>
			<button type="button" id="reset-btn" class="btn btn--secondary">초기화</button>
		</section>

		<section class="counters" aria-label="집계 카운터">
			<div class="counter counter--active">
				<span class="counter__value" id="active-count">0</span>
				<span class="counter__label">실행 중</span>
			</div>
			<div class="counter counter--pending">
				<span class="counter__value" id="pending-count">0</span>
				<span class="counter__label">대기 중</span>
			</div>
			<div class="counter counter--concurrency">
				<span class="counter__value" id="concurrency-count">3</span>
				<span class="counter__label">동시성</span>
			</div>
		</section>

		<div id="task-grid" aria-label="작업 상태 그리드"></div>
	</main>

	<script type="module" src="app.js"></script>
</body>
</html>
