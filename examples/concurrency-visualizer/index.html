<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>p-limit 동시성 시각화 예제</title>
	<!--
		디자인 시안은 designer(F68F701A7A-40) 담당 style.css 가 채운다.
		아직 배포 전이어도 아래 fallback 인라인 스타일로 상태가 시각적으로
		구분되며 file:// 단독 실행(외부 자원 0건)에서도 동작한다.
	-->
	<link rel="stylesheet" href="style.css">
	<!--
		p-limit 코어(../../index.js)는 transitive 의존으로 bare specifier
		'yocto-queue'(기존 dependency, 신규 추가 아님)를 import 한다.
		브라우저 네이티브 ESM 은 bare specifier 를 해석하지 못하므로 아래
		import map 으로 로컬 파일 경로에 매핑한다(외부 CDN 0건 — 저장소 루트에서
		`npm install` 후 정적 서버로 열면 동작). module 스크립트보다 먼저 위치한다.
	-->
	<script type="importmap">
	{
		"imports": {
			"yocto-queue": "../../node_modules/yocto-queue/index.js"
		}
	}
	</script>
	<style>
		:root { color-scheme: light dark; }
		body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
		.controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-bottom: 1rem; }
		.counters { display: flex; gap: 1.5rem; margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
		.counters strong { font-size: 1.4rem; }
		#task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.5rem, 1fr)); gap: 0.5rem; }
		.task {
			aspect-ratio: 1; display: grid; place-items: center;
			border-radius: 0.4rem; font-size: 0.85rem; color: #fff;
			background: #9ca3af; transition: background 0.2s ease;
		}
		.task[data-state="queued"] { background: #9ca3af; }
		.task[data-state="active"] { background: #2563eb; }
		.task[data-state="done"]   { background: #16a34a; }
		.task[data-state="error"]  { background: #dc2626; }
	</style>
</head>
<body>
	<h1>p-limit 동시성 시각화</h1>
	<p>
		작업 수와 동시성(concurrency)을 선택하고 실행하면, 각 작업이
		<em>대기(queued) → 실행(active) → 완료(done)/에러(error)</em>로 전이되는 과정과
		집계 카운터가 실시간으로 갱신됩니다.
	</p>

	<div class="controls">
		<label>
			작업 수
			<input type="number" id="task-count" min="1" max="30" value="20">
		</label>
		<label>
			동시성
			<input type="range" id="concurrency-slider" min="1" max="10" step="1" value="3">
			<output id="concurrency-value">3</output>
		</label>
		<button type="button" id="run-button">실행</button>
		<button type="button" id="reset-button">초기화</button>
	</div>

	<div class="counters">
		<span>실행 중 <strong id="active-count">0</strong></span>
		<span>대기 중 <strong id="pending-count">0</strong></span>
	</div>

	<div id="task-grid" aria-label="작업 상태 그리드"></div>

	<script type="module" src="app.js"></script>
</body>
</html>
